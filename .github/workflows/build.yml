name: Build Astro kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [ y2q ]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive   # ensures mkbootimg/mkdtimg submodules are pulled

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            dwarves \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            unzip \
            wget \
            zip \
            zstd

      - name: Set Neutron Clang toolchain
        run: |
          if [ ! -d "/home/atakan/geliştirme/tools/toolchains/neutron-clang/bin" ]; then
              echo "Error: Neutron Clang toolchain not found. Exiting."
              exit 1
          fi
          export PATH="/home/atakan/geliştirme/tools/toolchains/neutron-clang/bin:${PATH}"
          export KERNEL_LLVM_BIN="/home/atakan/geliştirme/tools/toolchains/neutron-clang/bin/clang"
          echo "Using Neutron Clang at $KERNEL_LLVM_BIN"

      - name: Prepare tools
        run: |
          chmod +x tools/mkdtimg || true

      - name: Build kernel + package
        run: |
          chmod +x build_astro.sh
          bash build_astro.sh "${{ matrix.device }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Kernel-${{ matrix.device }}
          path: Astro-Kernel-${{ matrix.device }}.zip
