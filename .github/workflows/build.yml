name: Build Astro kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [ y2q ]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive   # ensures mkbootimg/mkdtimg submodules are pulled

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            curl \
            dwarves \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            unzip \
            wget \
            zip \
            zstd

      - name: Download Neutron Clang
        run: |
          mkdir -p neutron-clang
           curl -L https://github.com/Neutron-Clang/neutron-clang/releases/download/20240406/neutron-clang-20240406.tar.zst \
          -o neutron-clang.tar.zst
          tar -I zstd -xf neutron-clang.tar.zst -C neutron-clang --strip-components=1
          rm neutron-clang.tar.zst
          echo "PATH=$(pwd)/neutron-clang/bin:$PATH" >> $GITHUB_ENV
          echo "KERNEL_LLVM_BIN=$(pwd)/neutron-clang/bin/clang" >> $GITHUB_ENV


      - name: Prepare tools
        run: |
          chmod +x tools/mkdtimg || true

      - name: Build kernel + package
        run: |
          chmod +x build_astro.sh
          bash build_astro.sh "${{ matrix.device }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astro-Kernel-${{ matrix.device }}
          path: Astro-Kernel-${{ matrix.device }}.zip
